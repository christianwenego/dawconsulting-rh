services:

  db:
    image: mysql:8.0
    container_name: dawc-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - dawc_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - dawc_network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: dawc-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      CORS_ALLOWED_ORIGINS: https://dawconsultinghr.com

      UPLOAD_DIR: /app/uploads

    expose:
      - "8080"

    volumes:
      - dawc_uploads:/app/uploads

    networks:
      - dawc_network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: dawc-frontend
    restart: unless-stopped

    depends_on:
      - backend

    expose:
      - "80"

    networks:
      - dawc_network


  caddy:
    image: caddy:2-alpine
    container_name: dawc-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dawc_caddy_data:/data
      - dawc_caddy_config:/config

    depends_on:
      - frontend
      - backend

    networks:
      - dawc_network


networks:
  dawc_network:
    driver: bridge


volumes:
  dawc_db:
  dawc_uploads:
  dawc_caddy_data:
  dawc_caddy_config: