# ============================================================
#  DAW Consulting RH - Configuration
#  Les valeurs sensibles sont surchargeables par variables d'env.
# ============================================================
spring.application.name=dawconsulting-rh-api
server.port=${SERVER_PORT:8080}

# --- Base de donnees MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dawconsulting_rh?useSSL=false&serverTimezone=Africa/Douala&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:dawconsulting}
spring.datasource.password=${DB_PASSWORD:dawconsulting}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Upload de fichiers (CV / lettres) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.storage.upload-dir=${UPLOAD_DIR:./uploads}

# --- Securite JWT ---
# IMPORTANT : remplacer la cle en production (>= 32 caracteres, base64 conseille)
app.jwt.secret=${JWT_SECRET:Q2hhbmdlTWVJblByb2R1Y3Rpb25EYXdDb25zdWx0aW5nUkhTZWNyZXRLZXkyMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION:43200000}

# --- Compte administrateur initial (cree au demarrage si absent) ---
app.admin.email=${ADMIN_EMAIL:admin@dawconsulting.cm}
app.admin.password=${ADMIN_PASSWORD:DawAdmin2026!}
app.admin.fullName=${ADMIN_NAME:Administrateur DAWC-HR}

# --- CORS (origines autorisees, separees par des virgules) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}

# --- Logs ---
logging.level.org.springframework.security=WARN
logging.level.com.dawconsulting=INFO
