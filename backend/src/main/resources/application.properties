spring.application.name=dawconsulting-rh-api
server.port=${SERVER_PORT:8080}

# --- Base de donn�es MySQL ---
# Utilise les variables d'environnement DB_URL, DB_USERNAME et DB_PASSWORD envoy�es par Docker
spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/dawconsulting_rh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:dawconsulting}
spring.datasource.password=${DB_PASSWORD:dawconsulting}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' permet d'aligner le sch�ma sans supprimer la base initiale charg�e par schema.sql
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# --- Upload de fichiers (CV / lettres) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.storage.upload-dir=${UPLOAD_DIR:/app/uploads}

# --- S�curit� JWT ---
app.jwt.secret=${JWT_SECRET:Q2hhbmdlTWVJblByb2R1Y3Rpb25EYXdDb25zdWx0aW5nUkhTZWNyZXRLZXkyMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION:43200000}

# --- Compte administrateur initial ---
app.admin.email=${ADMIN_EMAIL:admin@dawconsulting.cm}
app.admin.password=${ADMIN_PASSWORD:DawAdmin2026!}
app.admin.fullName=${ADMIN_NAME:Administrateur DAWC-HR}

# --- CORS ---
# R�cup�re CORS_ALLOWED_ORIGINS d�fini dans votre docker-compose
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost,https://dawconsultinghr.com}

# --- Logs ---
logging.level.org.springframework.security=WARN
logging.level.com.dawconsulting=INFO