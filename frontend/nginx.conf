server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/rss+xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location ~* \.(?:css|js|woff2|woff|png|jpg|jpeg|gif|svg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Dynamic XML sitemap generated from published jobs
  location = /sitemap.xml {
    proxy_pass http://backend:8080/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy API calls to the backend service
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  # Never cache the HTML shell: SEO metadata and Angular bundles can change.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Content-Type "text/plain; charset=utf-8" always;
    try_files $uri =404;
  }

  location ~ ^/(admin|emplois/.+/postuler)(?:/|$) {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri $uri/ /index.html;
  }

  # Angular SPA routing fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
