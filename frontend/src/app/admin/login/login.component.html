<div class="login-wrap">
  <div class="login-card">
    <a routerLink="/" class="brand">
      <svg class="globe" viewBox="0 0 100 100" fill="none" aria-hidden="true" style="color:var(--ink)">
        <circle cx="50" cy="50" r="46" stroke="var(--vermilion)" stroke-width="2.5"/>
        <ellipse cx="50" cy="50" rx="22" ry="46" stroke="currentColor" stroke-width="2"/>
        <line x1="4" y1="50" x2="96" y2="50" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>DAW Consulting<small>Human Resources</small></span>
    </a>
    <h1>Espace administrateur</h1>
    <p class="sub">Connectez-vous pour gérer les offres et candidatures.</p>

    @if (error()) { <div class="alert err">{{ error() }}</div> }

    <div class="fld">
      <label>Email</label>
      <input class="input" type="email" [formControl]="form.controls.email" placeholder="admin@dawconsulting.cm" (keyup.enter)="submit()">
    </div>
    <div class="fld">
      <label>Mot de passe</label>
      <input class="input" type="password" [formControl]="form.controls.password" placeholder="••••••••" (keyup.enter)="submit()">
    </div>
    <button class="btn btn-royal" style="width:100%;justify-content:center;margin-top:6px" [disabled]="submitting()" (click)="submit()">
      @if (submitting()) { <span class="spinner"></span> Connexion… }
      @else { Se connecter }
    </button>

    <p class="sub" style="margin-top:22px;margin-bottom:0;font-size:.78rem">
      <a routerLink="/" style="color:var(--royal)">← Retour au site</a>
    </p>
  </div>
</div>
